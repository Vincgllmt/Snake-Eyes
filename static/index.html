<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Eyes</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <!-- Éditeur WYSIWYG (le contenu reste stocké en Markdown) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/theme/toastui-editor-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tui-color-picker@2.2.8/dist/tui-color-picker.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor-plugin-color-syntax@3.1.0/dist/toastui-editor-plugin-color-syntax.min.css">
  <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/i18n/fr-fr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tui-color-picker@2.2.8/dist/tui-color-picker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@toast-ui/editor-plugin-color-syntax@3.1.0/dist/toastui-editor-plugin-color-syntax.min.js"></script>
  <!-- Import .docx → HTML (converti ensuite en Markdown par l'éditeur) -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>🎲🎲 Snake Eyes</h1>
    <div class="universe-picker">
      <label for="universe">Contexte</label>
      <select id="universe"></select>
      <button id="rename-universe" class="icon" title="Renommer ce contexte">✎</button>
      <button id="new-universe" class="icon" title="Nouveau contexte">+</button>
      <button id="delete-universe" class="icon danger" title="Supprimer ce contexte">🗑</button>
    </div>
    <nav>
      <button data-view="mj" class="active">Assistant MJ</button>
      <button data-view="joueur">Aide joueurs</button>
      <button data-view="lore">Univers</button>
      <button data-view="characters">Personnages</button>
    </nav>
  </header>

  <main>
    <!-- Chat (partagé entre les modes MJ et joueur) -->
    <section id="view-chat" class="view">
      <aside class="list">
        <div class="list-actions">
          <select id="new-character" title="Fiche du joueur (optionnel)" hidden></select>
          <button id="new-conversation" class="primary">+ Nouvelle conversation</button>
        </div>
        <ul id="conversations"></ul>
      </aside>
      <div class="chat">
        <div id="chat-empty" class="empty">Crée ou sélectionne une conversation.</div>
        <div id="chat-panel" hidden>
          <div class="chat-header">
            <input id="chat-title" aria-label="Titre de la conversation">
            <button id="delete-conversation" class="danger">Supprimer</button>
          </div>
          <div id="cast" class="cast" hidden>
            <span class="cast-label">Personnages concernés :</span>
            <span id="cast-chips"></span>
          </div>
          <div id="messages"></div>
          <form id="composer">
            <textarea id="input" rows="3" placeholder="Écris ton message… (Entrée pour envoyer, Maj+Entrée pour un retour à la ligne)"></textarea>
            <button type="submit" class="primary" id="send">Envoyer</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Éditeur générique (univers / personnages) -->
    <section id="view-editor" class="view" hidden>
      <aside class="list">
        <div class="list-actions">
          <button id="new-item" class="primary">+ Ajouter</button>
        </div>
        <ul id="items"></ul>
      </aside>
      <div class="editor">
        <div id="editor-empty" class="empty"></div>
        <form id="editor-form" hidden></form>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
